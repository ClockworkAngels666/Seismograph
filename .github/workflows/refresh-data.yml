# Saves a monthly copy of all data to data/snapshot/ so the app keeps working if an API goes down.
# Runs automatically on the 3rd of every month; you can also run it from the Actions tab ("Run workflow").
name: Refresh data snapshot

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt  # the snapshot also saves the index history, built with the app's code
      - name: Download the latest data
        run: python scripts/refresh_snapshot.py
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          git diff --cached --quiet || git commit -m "Refresh data snapshot"
          git push
