# Every Monday: check that the events watchlist still covers the next six months.
# If it is running low, open (or refresh) a reminder issue; once it is topped up, close the issue.
name: Watchlist check

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the events
        id: check
        run: |
          pip install --quiet pandas
          python scripts/check_watchlist.py
      - name: Open or close the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_UPDATE: ${{ steps.check.outputs.needs_update }}
        run: |
          title="Watchlist: add upcoming events"
          open_issue=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ "$NEEDS_UPDATE" = "true" ]; then
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --body-file watchlist_report.md
            else
              gh issue create --title "$title" --body-file watchlist_report.md
            fi
          elif [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "The watchlist covers the next six months again. Closing."
          fi
